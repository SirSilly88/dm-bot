services:
  - type: web
    name: tom-swoope-dm-bot
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: VERIFY_TOKEN
        generateValue: true
      - key: GRAPH_VERSION
        value: v23.0
      # Filled in by you in the Render dashboard (never committed):
      - key: APP_SECRET
        sync: false
      # One Page token per Page, separated by commas or spaces:
      - key: PAGE_ACCESS_TOKENS
        sync: false
